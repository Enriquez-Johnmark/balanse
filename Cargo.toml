[package]
name = "balanse"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "LICENSE"
description = "Polite payment follow-up for Philippine small businesses, on the Nudgewright engine"

[features]
# Test-only crash points for the D6 test; never enabled in production builds.
failpoints = ["nudgewright/failpoints"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
# The engine: draft, approve, send exactly once, stop on reply, track.
# Pinned to the commit tagged v0.3.0.
nudgewright = { version = "0.3.0", git = "https://github.com/Enriquez-Johnmark/nudgewright", rev = "13bd417637d06b03d153f8308845c013075629ba" }
reqwest = { version = "0.13.5", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "fs", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[[test]]
name = "d6_crash"
required-features = ["failpoints"]

# Line tables are enough for backtraces, and keep test builds small.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
needless_collect = "deny"
